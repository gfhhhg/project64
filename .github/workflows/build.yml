name: Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build target platform'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - windows
          - android
      windows_arch:
        description: 'Windows architecture (for Windows build)'
        required: false
        default: 'x64'
        type: choice
        options:
          - x64
          - Win32
          - both
      build_config:
        description: 'Build configuration'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  windows-x64:
    name: Build Windows x64
    runs-on: windows-latest
    if: ${{ (github.event.inputs.platform == 'windows' || github.event.inputs.platform == 'both') && (github.event.inputs.windows_arch == 'x64' || github.event.inputs.windows_arch == 'both') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        run: |
          msbuild Project64.sln /p:Configuration=${{ github.event.inputs.build_config }} /p:Platform=x64 /m
        shell: cmd

      - name: Find build output
        id: find_output
        run: |
          $config = "${{ github.event.inputs.build_config }}"
          $binDir = "Bin\x64\$config"
          $pluginDir = "Plugin\x64"

          if (Test-Path $binDir) {
            Write-Output "bin_dir=$binDir" >> $env:GITHUB_OUTPUT
          }

          if (Test-Path $pluginDir) {
            Write-Output "plugin_dir=$pluginDir" >> $env:GITHUB_OUTPUT
          }

          $exePath = "$binDir\Project64.exe"
          if (Test-Path $exePath) {
            Write-Output "exe_path=$exePath" >> $env:GITHUB_OUTPUT
          }

          $setupPath = Get-ChildItem -Path $binDir -Filter "Setup*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if ($setupPath) {
            Write-Output "setup_path=$setupPath" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Project64-Windows-x64-${{ github.event.inputs.build_config }}
          path: |
            Bin/x64/${{ github.event.inputs.build_config }}/
            Plugin/x64/
          if-no-files-found: warn

  windows-win32:
    name: Build Windows Win32
    runs-on: windows-latest
    if: ${{ (github.event.inputs.platform == 'windows' || github.event.inputs.platform == 'both') && (github.event.inputs.windows_arch == 'Win32' || github.event.inputs.windows_arch == 'both') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        run: |
          msbuild Project64.sln /p:Configuration=${{ github.event.inputs.build_config }} /p:Platform=Win32 /m
        shell: cmd

      - name: Find build output
        id: find_output
        run: |
          $config = "${{ github.event.inputs.build_config }}"
          $binDir = "Bin\Win32\$config"
          $pluginDir = "Plugin\Win32"

          if (Test-Path $binDir) {
            Write-Output "bin_dir=$binDir" >> $env:GITHUB_OUTPUT
          }

          if (Test-Path $pluginDir) {
            Write-Output "plugin_dir=$pluginDir" >> $env:GITHUB_OUTPUT
          }

          $exePath = "$binDir\Project64.exe"
          if (Test-Path $exePath) {
            Write-Output "exe_path=$exePath" >> $env:GITHUB_OUTPUT
          }

          $setupPath = Get-ChildItem -Path $binDir -Filter "Setup*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if ($setupPath) {
            Write-Output "setup_path=$setupPath" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Project64-Windows-Win32-${{ github.event.inputs.build_config }}
          path: |
            Bin/Win32/${{ github.event.inputs.build_config }}/
            Plugin/Win32/
          if-no-files-found: warn

  android:
    name: Build Android
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools: latest
          packages: 'build-tools;30.0.3 platforms;android-30 ndk;22.1.7171670 cmake;3.22.1'

      - name: Generate version.gradle
        run: |
          GIT_REV=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          GIT_YEAR=$(date +%Y)
          cp Android/config/version.gradle.in Android/config/version.gradle
          sed -i "s/VersionMajor = 4/VersionMajor = 4/" Android/config/version.gradle
          sed -i "s/VersionMinor = 0/VersionMinor = 0/" Android/config/version.gradle
          sed -i "s/VersionRevison = 0/VersionRevison = 0/" Android/config/version.gradle
          sed -i "s/VersionPrefix = \"Dev\"/VersionPrefix = \"Dev\"/" Android/config/version.gradle
          sed -i "s/versionCode = 1/versionCode = 1/" Android/config/version.gradle
          sed -i "s/versionName = \"4.0.0 (Unknown)\"/versionName = \"4.0.0 ($GIT_REV)\"/" Android/config/version.gradle

      - name: Setup Gradle
        working-directory: ./Android
        run: chmod +x gradlew

      - name: Build with Gradle
        working-directory: ./Android
        run: ./gradlew assembleRelease

      - name: Find APK
        id: find_apk
        run: |
          apk_path=$(find Android/app/build/outputs/apk -name "*.apk" | head -1)
          if [ -n "$apk_path" ]; then
            echo "apk_path=$apk_path" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Project64-Android
          path: Android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
